<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noraves · Control de Artes y Materiales</title>
<meta name="theme-color" content="#0d11b5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d11b5'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='900' font-size='34' fill='%23ffd300' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0d11b5; --navy-2:#060970; --navy-soft:#e7e8fb;
  --amber:#ffa700; --amber-soft:#fff4d6; --yellow:#ffd300;
  --bg:#f3f4f9; --card:#fff; --ink:#1b1f3b; --muted:#6b7090; --line:#e2e4ef;
  --ok:#17914f; --ok-soft:#e3f6ec; --bad:#d63b3b; --bad-soft:#fdeaea;
  --warn:#d98200; --warn-soft:#fff1d9; --ship:#2f68d8; --ship-soft:#e6eefd;
  --none:#9aa0b8; --none-soft:#f0f1f6;
  --r:14px; --sh:0 1px 2px rgba(20,25,60,.06),0 6px 20px rgba(20,25,60,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.right{margin-left:auto}

/* ---------- botones / inputs ---------- */
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--navy);color:#fff;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--navy-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.amber{background:var(--amber);color:var(--navy-2)}
.btn.amber:hover{background:var(--yellow)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--navy-soft);border-color:var(--navy-soft)}
.btn.danger{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.xs{padding:3px 8px;font-size:12px;border-radius:7px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none;transition:.15s}
.inp:focus{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}
select.inp{padding-right:30px}
label.f{display:block;font-size:13px;font-weight:600;margin:0 0 5px}
label.f .req{color:var(--bad)}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--none-soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ship{background:var(--ship-soft);color:var(--ship)}
.chip.navy{background:var(--navy-soft);color:var(--navy)}
.chip.amber{background:var(--amber-soft);color:#9a5d00}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.seg{display:inline-flex;gap:8px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--navy);box-shadow:0 1px 2px rgba(20,25,60,.06);transition:.15s}
.seg button:hover{border-color:var(--navy)}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 3px 10px rgba(13,17,181,.25)}

/* ---------- header ---------- */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.top .in{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;flex-direction:column;gap:3px;color:#fff}
.brand img{height:22px;width:auto;display:block}
.brand small{display:block;font-size:10px;letter-spacing:.12em;font-weight:600;color:var(--yellow)}
.top .who{margin-left:auto;text-align:right;font-size:13px;line-height:1.25}
.top .who b{display:block;font-size:14px}
.top .btn.ghost{color:#fff;border-color:rgba(255,255,255,.25)}
.top .btn.ghost:hover{background:rgba(255,255,255,.1)}
.wrap{max-width:1280px;margin:0 auto;padding:18px}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:
  radial-gradient(1200px 500px at 110% -10%,rgba(255,167,0,.35),transparent 60%),
  linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%)}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:30px 28px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-card .brand{align-items:center}
.login-card .brand img{height:auto;width:78%;max-width:280px}
.login-card h1{font-size:16px;text-align:center;margin:14px 0 22px;font-weight:600;color:var(--muted)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}

/* ---------- panel tienda ---------- */
.store-hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.store-hero h2{margin:0;font-size:22px}
.status-banner{border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;margin-bottom:16px;font-size:14px}
.status-banner.ok{background:var(--ok-soft);color:#0f6a39}
.status-banner.pending{background:var(--amber-soft);color:#7a4a00}
.progress{position:sticky;top:58px;z-index:20;background:rgba(243,244,249,.94);backdrop-filter:blur(8px);padding:10px 0;margin-bottom:6px}
.pbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--yellow));border-radius:99px;transition:width .25s}
.grp-title{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--navy);margin:26px 0 4px;display:flex;align-items:center;gap:10px}
.grp-title:after{content:"";flex:1;height:2px;background:var(--navy-soft)}
.cat-title{font-size:17px;font-weight:700;margin:12px 0 10px;display:flex;align-items:center;gap:10px}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;align-items:start}
@media(max-width:480px){.items-grid{grid-template-columns:1fr 1fr;gap:10px}}
.it{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;border:2px solid transparent;transition:border-color .15s}
.it.s-tiene{border-color:var(--ok)}
.it.s-no_tiene{border-color:var(--bad)}
.it.s-deteriorado{border-color:var(--warn)}
.it .ph{position:relative;background:linear-gradient(135deg,#f6f7fb,#eceef6);display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.it .ph img{width:100%;height:100%;object-fit:contain;display:block}
.it .ph .noimg{color:var(--none);font-size:12px}
.it .ph .badge{position:absolute;top:8px;left:8px}
.it .body{padding:10px 11px 11px}
.it .name{font-weight:600;font-size:14px;line-height:1.25;margin-bottom:8px;min-height:2.5em}
.ans{display:grid;gap:5px}
.ans button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px 8px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;color:var(--ink);transition:.12s;text-align:left}
.ans button .dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;color:#fff}
.ans button[data-s=tiene] .dot{background:var(--ok)}
.ans button[data-s=no_tiene] .dot{background:var(--bad)}
.ans button[data-s=deteriorado] .dot{background:var(--warn)}
.ans button[data-s=tiene].on{background:var(--ok);border-color:var(--ok);color:#fff}
.ans button[data-s=no_tiene].on{background:var(--bad);border-color:var(--bad);color:#fff}
.ans button[data-s=deteriorado].on{background:var(--warn);border-color:var(--warn);color:#fff}
.ans button.on .dot{background:#fff!important;color:var(--ink)}
.navbar{position:sticky;top:58px;z-index:20;background:rgba(243,244,249,.96);backdrop-filter:blur(8px);margin:-18px -18px 8px;padding:10px 18px 8px;border-bottom:1px solid var(--line)}
.cat-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.cat-tabs button small{color:var(--muted);font-weight:600;margin-left:3px}
.cat-tabs button .ck{color:var(--ok);margin-right:4px;font-weight:800}
.cat-tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.cat-tabs button.on small,.cat-tabs button.on .ck{color:var(--yellow)}
.cat-tabs button.send{border-color:var(--amber);color:var(--navy-2)}
.cat-tabs button.send.on{background:var(--amber);border-color:var(--amber);color:var(--navy-2)}
.steps{display:grid;gap:10px}
.mv{display:inline-flex;gap:2px;margin-right:4px}
.mv .btn{padding:3px 7px;font-size:13px;line-height:1}
.mv .btn:disabled{opacity:.25}
.bal-block{border:2px solid var(--amber)}
.bal-block .hd{background:var(--amber-soft);flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.grp-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;transition:border-color .15s}
.grp-card.open{border-color:var(--navy)}
.grp-head{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:14px 16px}
.grp-head .step-n{width:40px;height:40px;font-size:18px}
.grp-arrow{font-size:22px;color:var(--muted);transition:transform .2s}
.grp-card.open .grp-arrow{transform:rotate(90deg);color:var(--navy)}
.grp-body{display:grid;gap:8px;padding:0 12px 12px;background:#fafbff;border-top:1px solid var(--line);padding-top:12px}
.step-card.sub{box-shadow:none;padding:10px 12px}
.qty-q{font-size:12.5px;font-weight:700;margin:10px 0 6px;color:var(--ink)}
.qty-chips{display:flex;flex-wrap:wrap;gap:6px}
.qty-chips button{min-width:40px;height:38px;border:1.5px solid var(--line);background:#fff;border-radius:9px;font-weight:700;font-size:15px;color:var(--navy)}
.qty-chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.camp-card{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:var(--r);padding:14px 16px;margin-bottom:12px;color:#fff;background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 100%);box-shadow:0 6px 18px rgba(13,17,181,.25)}
.camp-card .camp-ico{font-size:26px}
.photo-btn{display:flex;align-items:center;gap:7px;margin-top:6px;border:1.5px dashed var(--line);border-radius:9px;padding:6px 8px;font-size:12px;font-weight:600;color:var(--navy);cursor:pointer}
.photo-btn img{width:34px;height:34px;object-fit:cover;border-radius:6px;background:#eef0f7}
.store-pick{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.sp-city{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--navy);padding:2px 0 6px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 12px}
.sp-item{display:grid;grid-template-columns:auto 46px 1fr;align-items:center;gap:6px;font-size:13px;padding:3px 0;cursor:pointer}
.sp-item b{color:var(--navy);font-size:12px}
.sp-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:480px){.sp-grid{grid-template-columns:1fr 1fr}.sp-item{grid-template-columns:auto 1fr}.sp-item b{grid-column:2}.sp-item span{grid-column:2;font-size:12px;margin-top:-4px;white-space:normal}}
@media(max-width:480px){.modal .mf .btn{flex:1}}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;max-height:300px;overflow:auto;padding:2px}
.pick{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12.5px;cursor:pointer}
.pick:has(input:checked){border-color:var(--navy);background:var(--navy-soft)}
.pick img{width:30px;height:40px;object-fit:contain;background:#f2f3f8;border-radius:5px;flex:none}
.pick small{display:block;color:var(--muted);font-size:11px}
.step-card{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);width:100%;transition:.15s}
.step-card:hover{border-color:var(--navy)}
.step-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--navy-soft);color:var(--navy);flex:none}
.step-n.ok{background:var(--ok);color:#fff}
.step-n.warn{background:var(--amber);color:var(--navy-2)}
.step-card .thumbs,.grp-head .thumbs{display:flex}
.step-card .thumbs img,.grp-head .thumbs img{width:30px;height:40px;object-fit:cover;border-radius:5px;border:2px solid #fff;margin-left:-8px;background:#eef0f7;box-shadow:0 1px 3px rgba(0,0,0,.15)}
@media(max-width:480px){.step-card .thumbs,.grp-head .thumbs{display:none}}
.send-bar{position:sticky;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,25,60,.06);margin:24px -18px -18px;padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.send-bar .in{max-width:1280px;margin:0 auto;display:flex;gap:12px;align-items:center}

/* ---------- admin ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--navy-2)}
.tabs .in{max-width:1280px;margin:0 auto;display:flex;gap:2px;padding:0 12px}
.tabs button{background:transparent;border:0;color:rgba(255,255,255,.7);padding:11px 14px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom-color:var(--amber)}
.tabs button:hover{color:#fff}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar h2{margin:0 8px 0 0;font-size:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.kpi .v{font-size:28px;font-weight:800;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi.ok .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ship .v{color:var(--ship)}
.tbl-wrap{overflow:auto;background:#fff;border-radius:var(--r);box-shadow:var(--sh);max-height:70vh}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
table.t th,table.t td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t thead th{position:sticky;top:0;background:#f7f8fc;z-index:2;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;white-space:nowrap}
table.t tbody tr:hover td{background:#fafbff}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.city td{background:var(--navy-soft);font-weight:700;color:var(--navy)}
.thumb{width:38px;height:38px;object-fit:contain;border-radius:6px;background:#f2f3f8;flex:none}
/* matriz */
table.mx{font-size:12px}
table.mx thead{position:sticky;top:0;z-index:3}
table.mx thead th{position:static}
table.mx th.it-h{text-transform:none;letter-spacing:0;min-width:74px;max-width:90px;padding:6px 4px;vertical-align:bottom;text-align:center;font-weight:600;color:var(--ink);font-size:10.5px;line-height:1.2;white-space:normal;background:#f7f8fc}
table.mx th.it-h img{display:block;width:30px;height:40px;object-fit:contain;margin:0 auto 4px;border-radius:4px;background:#eef0f7}
table.mx th.cat-h{text-align:left;padding-left:10px;background:var(--navy);color:#fff;font-size:11px;top:0;border-left:2px solid #fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40px}
table.mx td.c{text-align:center;padding:5px 3px;min-width:30px;font-size:14px;font-weight:700}
table.mx td.st,table.mx th.st{position:sticky;left:0;background:#fff;z-index:1;min-width:170px}
table.mx thead th.st{position:sticky;left:0;z-index:4;background:#f7f8fc}
.c-tiene{color:var(--ok);background:var(--ok-soft)}
.c-no_tiene{color:var(--bad);background:var(--bad-soft)}
.c-deteriorado{color:var(--warn);background:var(--warn-soft)}
.c-en_camino{color:var(--ship);background:var(--ship-soft)}
.c-sin_dato{color:var(--none)}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
.store-block{background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.store-block .hd{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.store-block .hd h3{margin:0;font-size:16px}
.need-row{display:flex;gap:12px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line)}
.need-row:last-child{border-bottom:0}
.need-row input[type=number]{width:62px;padding:5px 7px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.cat-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cat-item{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:var(--sh)}
.cat-item.off{opacity:.5}

/* ---------- modal / toast / lightbox ---------- */
.ov{position:fixed;inset:0;background:rgba(15,20,50,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .16s ease-out}
.modal.wide{max-width:860px}
.modal .mh{padding:18px 22px 6px;display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:18px}
.modal .mb{padding:10px 22px 6px}
.modal .mf{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.x{border:0;background:var(--none-soft);width:32px;height:32px;border-radius:50%;margin-left:auto;font-size:18px;line-height:1}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:grid;gap:8px;width:min(92vw,420px)}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .2s}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)}
.lb{position:fixed;inset:0;background:rgba(10,12,30,.9);z-index:150;display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:90vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb .cap{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-weight:600}
.spin{width:38px;height:38px;border:4px solid var(--navy-soft);border-top-color:var(--navy);border-radius:50%;animation:sp 0.8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.photo-drop{border:2px dashed var(--line);border-radius:12px;padding:12px;display:flex;gap:14px;align-items:center;cursor:pointer;background:#fafbff}
.photo-drop:hover{border-color:var(--navy)}
.photo-drop img{width:90px;height:110px;object-fit:contain;background:#eef0f7;border-radius:8px}

<script>
/* =====================================================================
   CONFIGURACIÓN
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://elnvvoxgfnyicsrutvxs.supabase.co',
  SUPABASE_KEY: 'sb_publishable_5ksSTQvMzYeYcGnm-boWRg_p-CRLUI1',
  STORE_EMAIL_DOMAIN: 'tiendas.noraves.app',   // usuario de tienda = codigo@este-dominio
  BUCKET: 'articulos',
  FN_TIENDAS: 'gestionar-tienda',
  TZ: 'America/Lima',
  EXCELJS: 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',
};
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => new Intl.DateTimeFormat('es-PE', {timeZone: CONFIG.TZ, day:'2-digit', month:'2-digit', year:'numeric'}).format(new Date(d));
const fmtTime = d => new Intl.DateTimeFormat('es-PE', {timeZone: CONFIG.TZ, hour:'2-digit', minute:'2-digit', hour12:false}).format(new Date(d));
const fmtDT = d => `${fmtDate(d)} ${fmtTime(d)}`;
const money = n => n == null || n === '' ? '' : 'S/ ' + Number(n).toFixed(2);
const currentPeriod = () => new Intl.DateTimeFormat('en-CA', {timeZone: CONFIG.TZ, year:'numeric', month:'2-digit'}).format(new Date()) + '-01';
const periodLabel = p => { const [y, m] = p.split('-'); const s = new Date(+y, +m - 1, 1).toLocaleDateString('es-PE', {month:'long', year:'numeric'}); return s[0].toUpperCase() + s.slice(1); };
const STATUS = {
  tiene:       {label:'Lo tenemos',    short:'Tiene',       icon:'✓', cls:'ok'},
  no_tiene:    {label:'No lo tenemos', short:'No tiene',    icon:'✕', cls:'bad'},
  deteriorado: {label:'Deteriorado',   short:'Deteriorado', icon:'!', cls:'warn'},
  en_camino:   {label:'En camino',     short:'En camino',   icon:'➜', cls:'ship'},
  sin_dato:    {label:'Sin dato',      short:'Sin dato',    icon:'·', cls:''},
};
const GRUPOS = ['ARTES', 'MATERIALES'];

function show(id) {
  ['login', 'storeView', 'adminView', 'boot'].forEach(x => $('#' + x).classList.toggle('hidden', x !== id));
}
function toast(msg, type = '') {
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').append(t); setTimeout(() => t.remove(), type === 'bad' ? 6000 : 3200);
}
function modal(title, bodyHtml, {wide = false, footer = ''} = {}) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
    <div class="mh"><h3>${title}</h3><button class="x" aria-label="Cerrar">×</button></div>
    <div class="mb">${bodyHtml}</div>${footer ? `<div class="mf">${footer}</div>` : ''}</div>`;
  const close = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('.x') || e.target.closest('[data-close]')) close(); });
  document.body.append(ov);
  return {el: ov, close};
}
function confirmBox(title, html, okText = 'Confirmar', danger = false) {
  return new Promise(res => {
    const m = modal(title, html, {footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn ${danger ? 'danger' : ''}" data-ok>${okText}</button>`});
    m.el.addEventListener('click', e => { if (e.target.closest('[data-ok]')) { m.close(); res(true); } });
    const obs = new MutationObserver(() => { if (!document.body.contains(m.el)) { obs.disconnect(); res(false); } });
    obs.observe(document.body, {childList: true});
  });
}
function lightbox(src, cap) {
  const d = document.createElement('div'); d.className = 'lb';
  d.innerHTML = `<img src="${esc(src)}" alt=""><div class="cap">${esc(cap || '')}</div>`;
  d.onclick = () => d.remove(); document.body.append(d);
}
function photoUrl(path) {
  if (!path) return '';
  if (path.startsWith('seed/')) return 'fotos/' + path.slice(5);           // fotos iniciales servidas desde el repo
  return sb.storage.from(CONFIG.BUCKET).getPublicUrl(path).data.publicUrl;  // fotos subidas por el admin
}
function errMsg(e) {
  const m = e?.message || String(e);
  if (/Invalid login/i.test(m)) return 'Usuario o contraseña incorrectos';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión. Revisa tu internet e inténtalo de nuevo.';
  return m;
}
async function q(promise) { const {data, error} = await promise; if (error) throw error; return data; }
async function fetchAll(build) {
  const out = []; const size = 1000;
  for (let from = 0; ; from += size) {
    const rows = await q(build().range(from, from + size - 1));
    out.push(...rows); if (rows.length < size) break;
  }
  return out;
}
function chunk(arr, n) { const r = []; for (let i = 0; i < arr.length; i += n) r.push(arr.slice(i, i + n)); return r; }
const store = {   // localStorage seguro
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

/* Optimiza una imagen en el navegador → WebP (grande para PC + miniatura para celular) */
async function optimizeImage(file) {
  const bmp = await createImageBitmap(file);
  const make = async (max, quality) => {
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * s), h = Math.round(bmp.height * s);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(bmp, 0, 0, w, h);
    let blob = await new Promise(r => c.toBlob(r, 'image/webp', quality));
    if (!blob || blob.type !== 'image/webp') blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality)); // Safari antiguo
    return blob;
  };
  const full = await make(1600, 0.82), thumb = await make(480, 0.78);
  return {full, thumb, w: bmp.width, h: bmp.height};
}

/* =====================================================================
   SESIÓN Y RUTEO POR ROL
   ===================================================================== */
let ME = null;
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#lgBtn'), err = $('#loginErr');
  err.classList.add('hidden'); btn.disabled = true; btn.textContent = 'Ingresando…';
  const u = $('#lgUser').value.trim();
  const email = u.includes('@') ? u.toLowerCase() : `${u.toLowerCase()}@${CONFIG.STORE_EMAIL_DOMAIN}`;
  const {error} = await sb.auth.signInWithPassword({email, password: $('#lgPass').value});
  btn.disabled = false; btn.textContent = 'Ingresar';
  if (error) { err.textContent = errMsg(error); err.classList.remove('hidden'); return; }
  route();
});
document.addEventListener('click', async e => {
  if (e.target.closest('[data-logout]')) { await sb.auth.signOut(); location.reload(); }
});

async function route() {
  show('boot');
  const {data: {session}} = await sb.auth.getSession();
  if (!session) return show('login');
  try {
    const prof = await q(sb.from('profiles').select('*').eq('user_id', session.user.id).maybeSingle());
    if (!prof) throw new Error('Tu usuario no tiene permisos en el sistema. Contacta a Marketing.');
    ME = {user: session.user, profile: prof};
    if (prof.role === 'admin') await initAdmin(); else await initStore();
  } catch (e) {
    await sb.auth.signOut();
    show('login'); $('#loginErr').textContent = errMsg(e); $('#loginErr').classList.remove('hidden');
  }
}

/* =====================================================================
   PANEL DE TIENDA
   ===================================================================== */
const ST = {store: null, cats: [], items: [], ships: {}, subs: [], answers: {}, notes: '', period: currentPeriod()};
const draftKey = () => `nv_draft_${ST.store.id}_${ST.period}`;

async function initStore() {
  const sid = ME.profile.store_id;
  const [st, cats, items, ships, subs] = await Promise.all([
    q(sb.from('stores').select('*, cities(name)').eq('id', sid).single()),
    q(sb.from('categories').select('*').eq('active', true).order('sort')),
    q(sb.from('items').select('*').eq('active', true).order('sort').order('name')),
    q(sb.from('shipments').select('*').eq('status', 'en_camino')),
    q(sb.from('submissions').select('*').order('submitted_at', {ascending: false}).limit(6)),
  ]);
  const catIds = new Set(cats.map(c => c.id));
  Object.assign(ST, {store: st, cats, items: items.filter(i => catIds.has(i.category_id)), subs});
  ST.ships = {}; ships.forEach(s => ST.ships[s.item_id] = s);
  ST.prev = null;
  if (subs[0]) {
    const rows = await q(sb.from('submission_items').select('item_id,status,qty,qty_bad').eq('submission_id', subs[0].id));
    const isQty = id => (ST.items.find(i => i.id === id)?.max_qty || 1) > 1;
    if (rows.length) ST.prev = {at: subs[0].submitted_at, answers: Object.fromEntries(rows
      .map(r => [r.item_id, isQty(r.item_id) && needs(r.status) ? {status: r.status, qty: r.qty || 1} : r.status]))};
  }
  const d = store.get(draftKey()) || {};
  ST.answers = d.answers || {}; ST.notes = d.notes || '';
  // solo respuestas de artículos que siguen activos
  Object.keys(ST.answers).forEach(k => { const it = ST.items.find(i => i.id == k);
    if (!it || (typeof ST.answers[k] === 'object' && it.max_qty <= 1)) delete ST.answers[k]; });
  ST.step = 'home';
  await loadStoreCampaigns();
  $('#stName').textContent = st.name;
  $('#stMeta').textContent = `${st.code} · ${st.cities?.name || ''}`;
  show('storeView');
  renderStore();
}

/* Pasos: 'home' → una categoría a la vez → 'resumen' */
function storeSteps() {
  const out = [];
  for (const g of GRUPOS) ST.cats.filter(c => c.grupo === g).forEach(c => {
    const its = ST.items.filter(i => i.category_id === c.id);
    if (its.length) out.push({cat: c, items: its, done: its.filter(answered).length});
  });
  return out;
}
function navBar(steps, current) {
  const total = ST.items.length, done = ST.items.filter(answered).length;
  return `<div class="navbar"><div class="cat-tabs">
    <button data-step="home" class="${current === 'home' ? 'on' : ''}">☰ Inicio</button>
    ${steps.map(s => { const full = s.done === s.items.length;
      return `<button data-step="${s.cat.id}" class="${current === s.cat.id ? 'on' : ''}">${full ? '<span class="ck">✓</span>' : ''}${esc(s.cat.name)} <small>${s.done}/${s.items.length}</small></button>`; }).join('')}
    <button data-step="resumen" class="send ${current === 'resumen' ? 'on' : ''}">Enviar ➜</button></div>
    <div class="pbar" style="height:5px;margin-top:8px"><i style="width:${total ? done / total * 100 : 0}%"></i></div>
    <div class="small muted" style="margin-top:4px"><b>${done} de ${total}</b> revisados${total - done ? ` · faltan ${total - done}` : ' · ¡todo listo!'}</div></div>`;
}
function goStep(step) {
  if (typeof step === 'number') { const c = ST.cats.find(x => x.id === step); if (c) ST.openGroup = c.grupo; } ST.step = step; renderStore(); window.scrollTo({top: 0}); $('.cat-tabs .on')?.scrollIntoView({inline: 'center', block: 'nearest'}); }

function renderStore() {
  if (typeof ST.step === 'string' && ST.step.startsWith('camp:')) return renderCampaign(+ST.step.slice(5));
  const steps = storeSteps();
  const total = ST.items.length, done = ST.items.filter(answered).length;
  const progress = `<div class="progress"><div class="row small" style="margin-bottom:6px"><b>${done} de ${total} revisados</b><span class="right muted">${total - done ? `Faltan ${total - done}` : '¡Todo revisado!'}</span></div>
    <div class="pbar"><i style="width:${total ? done / total * 100 : 0}%"></i></div></div>`;
  const idx = steps.findIndex(s => s.cat.id === ST.step);
  if (idx >= 0) return renderStoreCategory(steps, idx, progress);
  if (ST.step === 'resumen') return renderStoreResumen(steps, progress);
  ST.step = 'home';

  const last = ST.subs.find(s => s.period === ST.period);
  const enCamino = ST.items.filter(i => ST.ships[i.id]).length;
  const next = steps.find(s => s.done < s.items.length);
  let html = `
  <div class="store-hero"><div><h2>Control de ${esc(periodLabel(ST.period).toLowerCase())}</h2>
    <div class="muted small">Elige una categoría y marca cada pieza: la tienen, falta o está deteriorada. Puedes ir en el orden que quieras.</div></div></div>
  ${last && last.source !== 'importado'
    ? `<div class="status-banner ok"><b style="font-size:20px">✓</b><div>Ya enviaste el control de este mes el <b>${fmtDate(last.submitted_at)}</b> a las <b>${fmtTime(last.submitted_at)}</b>.<br><span class="small">Si algo cambió, puedes volver a enviarlo; Marketing verá la versión más reciente.</span></div></div>`
    : `<div class="status-banner pending"><b style="font-size:20px">!</b><div>Aún no envías el control de <b>${esc(periodLabel(ST.period).toLowerCase())}</b>.${last ? '<br><span class="small">Marketing cargó tu último estado desde el Excel. Revísalo y envía tu control actualizado.</span>' : ''}</div></div>`}
  ${enCamino ? `<div class="status-banner" style="background:var(--ship-soft);color:#1d4aa5"><b style="font-size:18px">➜</b><div>Marketing te envió <b>${enCamino}</b> pieza(s) que están <b>en camino</b>. Cuando lleguen, márcalas como "Lo tenemos".</div></div>` : ''}
  ${campaignCards()}
  ${progress}
  ${ST.prev && !done ? `<div class="row" style="margin:4px 0 14px"><button class="btn ghost sm" id="stPrev">↺ Cargar mis respuestas anteriores (${fmtDate(ST.prev.at)})</button><span class="small muted">Luego corrige solo lo que cambió.</span></div>` : ''}
  <div class="steps">${GRUPOS.map(g => {
    const gs = steps.filter(x => x.cat.grupo === g); if (!gs.length) return '';
    const tot = gs.reduce((a, x) => a + x.items.length, 0), dn = gs.reduce((a, x) => a + x.done, 0), open = ST.openGroup === g;
    const st = dn === tot ? 'ok' : dn ? 'warn' : '';
    const thumbs = gs.flatMap(x => x.items).slice(0, 3);
    return `<div class="grp-card ${open ? 'open' : ''}">
      <button class="grp-head" data-group="${g}">
        <span class="step-n ${st}">${st === 'ok' ? '✓' : g === 'ARTES' ? '🎨' : '🧰'}</span>
        <span class="grow" style="text-align:left"><b style="font-size:16px">${g === 'ARTES' ? 'Artes' : 'Materiales'}</b><br>
          <span class="small muted">${gs.length} categoría(s) · ${gs.map(x => esc(x.cat.name)).join(', ')}</span></span>
        <span class="thumbs">${thumbs.map(i => `<img src="${esc(photoUrl(i.thumb_path))}" alt="" loading="lazy">`).join('')}</span>
        <span class="chip ${st}">${dn}/${tot}</span><span class="grp-arrow">›</span></button>
      ${open ? `<div class="grp-body">${gs.map(x => { const sx = x.done === x.items.length ? 'ok' : x.done ? 'warn' : '';
        return `<button class="step-card sub" data-step="${x.cat.id}">
          <span class="step-n ${sx}">${sx === 'ok' ? '✓' : steps.indexOf(x) + 1}</span>
          <span class="grow" style="text-align:left"><b>${esc(x.cat.name)}</b></span>
          <span class="thumbs">${x.items.slice(0, 3).map(i => `<img src="${esc(photoUrl(i.thumb_path))}" alt="" loading="lazy">`).join('')}</span>
          <span class="chip ${sx}">${x.done}/${x.items.length}</span><span class="muted" style="font-size:20px">›</span></button>`; }).join('')}</div>` : ''}
    </div>`; }).join('')}

/* Respuesta = "estado" o, en materiales con pedido por cantidad, {status, qty} */
const ansState = (it, a) => !a ? null : typeof a === 'string' ? a : a.status;
const ansQty = a => typeof a === 'object' && a ? a.qty : null;
/* ¿Respondido? Si falta o está deteriorado y se pide por cantidad, debe elegir cuántos */
function answered(it) {
  const a = ST.answers[it.id], st = ansState(it, a);
  if (!st) return false;
  return !(it.max_qty > 1 && needs(st) && !ansQty(a));
}
function ansLabel(it, a) {
  const st = ansState(it, a), q = ansQty(a);
  return STATUS[st].short + (q && needs(st) ? ` · pide ${q}` : '');
}

function itemCard(it) {
  const ans = ST.answers[it.id], a = ansState(it, ans), q = ansQty(ans);
  const ratio = it.photo_w && it.photo_h ? Math.min(Math.max(it.photo_w / it.photo_h, 0.55), 1.9) : 0.75;
  const src = photoUrl(it.thumb_path || it.photo_path);
  const ship = ST.ships[it.id];
  return `<div class="it ${a ? 's-' + a : ''}" id="it-${it.id}">
    <div class="ph" style="aspect-ratio:${ratio}" data-zoom="${it.id}">
      ${src ? `<img loading="lazy" src="${esc(src)}" alt="${esc(it.name)}">` : '<span class="noimg">Sin foto</span>'}
      ${ship ? `<span class="chip ship badge">➜ En camino</span>` : ''}
    </div>
    <div class="body"><div class="name">${esc(it.name)}</div>
      <div class="ans">${['tiene', 'no_tiene', 'deteriorado'].map(s =>
        `<button type="button" data-item="${it.id}" data-s="${s}" class="${a === s ? 'on' : ''}"><span class="dot">${STATUS[s].icon}</span>${STATUS[s].label}</button>`).join('')}</div>
      ${it.max_qty > 1 && needs(a) ? `<div class="qty-q">¿Cuántos necesitan? <span class="muted">(máx. ${it.max_qty})</span></div>
        <div class="qty-chips">${Array.from({length: it.max_qty}, (_, k) => k + 1).map(n =>
          `<button type="button" data-qitem="${it.id}" data-n="${n}" class="${q === n ? 'on' : ''}">${n}</button>`).join('')}</div>
        ${!q ? '<div class="small" style="color:var(--bad);margin-top:4px">Elige una cantidad</div>' : ''}` : ''}
    </div></div>`;
}

function saveDraft() { store.set(draftKey(), {answers: ST.answers, notes: ST.notes}); }

document.addEventListener('click', e => {
  if (!ST.store || $('#storeView').classList.contains('hidden')) return;
  const b = e.target.closest('.ans button');
  if (b) {
    const id = b.dataset.item, left = () => ST.items.filter(i => i.category_id == ST.step && !answered(i)).length;
    const before = left();
    const it = ST.items.find(i => i.id == id), prevQ = ansQty(ST.answers[id]);
    ST.answers[id] = it?.max_qty > 1 && needs(b.dataset.s) ? {status: b.dataset.s, qty: prevQ || null} : b.dataset.s; saveDraft();
    const y = window.scrollY; renderStore(); window.scrollTo(0, y);
    if (before > 0 && left() === 0) toast('Categoría completa ✓ Toca "Siguiente".', 'ok');
    return;
  }
  const gh = e.target.closest('[data-group]');
  if (gh) { ST.openGroup = ST.openGroup === gh.dataset.group ? null : gh.dataset.group; renderStore(); gh && $(`[data-group="${ST.openGroup}"]`)?.scrollIntoView({block: 'nearest', behavior: 'smooth'}); return; }
  const qb = e.target.closest('[data-qitem]');
  if (qb) {
    const id = qb.dataset.qitem, left = () => ST.items.filter(i => i.category_id == ST.step && !answered(i)).length, before = left();
    ST.answers[id] = {status: ansState(null, ST.answers[id]), qty: +qb.dataset.n};
    saveDraft(); const y = window.scrollY; renderStore(); window.scrollTo(0, y);
    if (before > 0 && left() === 0) toast('Categoría completa ✓ Toca "Siguiente".', 'ok');
    return;
  }
  const stp = e.target.closest('[data-step]');
  if (stp && !stp.disabled) { e.preventDefault(); const v = stp.dataset.step; return goStep(/^\d+$/.test(v) ? +v : v); }
  const z = e.target.closest('[data-zoom]');
  if (z) { const it = ST.items.find(i => i.id == z.dataset.zoom); if (it?.photo_path) lightbox(photoUrl(it.photo_path), it.name); return; }
  if (e.target.closest('#stSend')) sendChecklist();
  if (e.target.closest('#stPrev')) {
    ST.items.forEach(i => { const pv = ST.prev.answers[i.id];
      if (!ST.answers[i.id] && pv != null) ST.answers[i.id] = pv; });
    saveDraft(); renderStore(); toast('Respuestas anteriores cargadas. Revisa y corrige lo que cambió.');
  }
});
document.addEventListener('input', e => { if (e.target.id === 'stNotes') { ST.notes = e.target.value; saveDraft(); } });

async function sendChecklist() {
  const c = s => ST.items.filter(i => ansState(i, ST.answers[i.id]) === s).length;
  const ok = await confirmBox('¿Enviar control?', `
    <p>Vas a enviar el control de <b>${esc(ST.store.name)}</b> (${esc(ST.store.code)}).</p>
    <div class="sum3"><div class="c-tiene"><b>${c('tiene')}</b>Lo tenemos</div><div class="c-no_tiene"><b>${c('no_tiene')}</b>No lo tenemos</div><div class="c-deteriorado"><b>${c('deteriorado')}</b>Deteriorado</div></div>
    <p class="small muted">Se registrará la fecha y hora de envío.</p>`, 'Enviar');
  if (!ok) return;
  const btn = $('#stSend'); btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    const answers = {}; ST.items.forEach(i => answers[i.id] = ST.answers[i.id]);
    const r = await q(sb.rpc('submit_checklist', {p_answers: answers, p_notes: ST.notes || null}));
    store.del(draftKey());
    modal('¡Control enviado! ✓', `<p style="font-size:15px">Se registró el envío de <b>${esc(ST.store.name)}</b> el <b>${fmtDate(r.submitted_at)}</b> a las <b>${fmtTime(r.submitted_at)}</b>.</p><p class="muted small">Gracias. Marketing ya puede ver tu reporte.</p>`, {footer: '<button class="btn" data-close>Listo</button>'});

  } catch (e) {
    toast('No se pudo enviar: ' + errMsg(e), 'bad');
    btn.disabled = false; btn.textContent = 'Guardar y enviar';
  }
}

const today = () => new Intl.DateTimeFormat('en-CA', {timeZone: CONFIG.TZ}).format(new Date());   // YYYY-MM-DD
const fmtD = d => d ? d.split('-').reverse().join('/') : '';
const CSTATUS = {
  llego:        {label: 'Llegó',          short: 'Llegó',        icon: '✓', cls: 'ok'},
  no_llego:     {label: 'Aún no llegó',   short: 'No llegó',     icon: '✕', cls: 'bad'},
  llego_danado: {label: 'Llegó dañado',   short: 'Dañado',       icon: '!', cls: 'warn'},
};
const campDraftKey = id => `nv_camp_${ST.store.id}_${id}`;

async function loadStoreCampaigns() {
  ST.camps = []; ST.campAns = {}; ST.campNotes = {};
  try {
    const t = today();
    const camps = (await q(sb.from('campaigns').select('*').eq('active', true).lte('start_date', t).gte('end_date', t).order('end_date')));
    if (!camps.length) return;
    const ids = camps.map(c => c.id);
    const [ci, subs] = await Promise.all([
      q(sb.from('campaign_items').select('*').in('campaign_id', ids)),
      q(sb.from('campaign_submissions').select('*').in('campaign_id', ids).order('submitted_at', {ascending: false})),
    ]);
    const itemIds = [...new Set(ci.map(r => r.item_id))];
    const items = itemIds.length ? await q(sb.from('items').select('*').in('id', itemIds)) : [];
    const byId = Object.fromEntries(items.map(i => [i.id, i]));
    for (const c of camps) {
      c.items = ci.filter(r => r.campaign_id === c.id).map(r => byId[r.item_id]).filter(Boolean).sort((a, b) => a.sort - b.sort);
      c.last = subs.find(s => s.campaign_id === c.id) || null;
      const d = store.get(campDraftKey(c.id));
      ST.campAns[c.id] = d?.answers || {}; ST.campNotes[c.id] = d?.notes || '';
      if (!d && c.last) {   // precarga lo último que validó
        const rows = await q(sb.from('campaign_submission_items').select('*').eq('submission_id', c.last.id));
        rows.forEach(r => ST.campAns[c.id][r.item_id] = {status: r.status, photo: r.photo_path});
      }
    }
    ST.camps = camps.filter(c => c.items.length);
  } catch (e) { console.error(e); }
}

function campaignCards() {
  if (!ST.camps?.length) return '';
  return ST.camps.map(c => `<button class="camp-card" data-step="camp:${c.id}">
    <span class="camp-ico">📣</span>

function campItemCard(c, it) {
  const a = ST.campAns[c.id][it.id] || {};

async function sendCampaign(cid) {
  const c = ST.camps.find(x => x.id === cid), ans = ST.campAns[cid];
  const n = k => c.items.filter(i => ans[i.id]?.status === k).length;
  const ok = await confirmBox('¿Enviar validación?', `<p>Campaña <b>${esc(c.name)}</b> · ${esc(ST.store.name)}</p>
    <div class="sum3"><div class="c-tiene"><b>${n('llego')}</b>Llegó</div><div class="c-no_tiene"><b>${n('no_llego')}</b>Aún no llegó</div><div class="c-deteriorado"><b>${n('llego_danado')}</b>Llegó dañado</div></div>
    <p class="small muted">${c.items.filter(i => ans[i.id]?.photo).length} foto(s) adjunta(s). Se registrará la fecha y hora.</p>`, 'Enviar');
  if (!ok) return;

  try {

async function loadAdmin() {
  const [cities, stores, cats, items, iadm, subs, ships] = await Promise.all([
    q(sb.from('cities').select('*').order('sort').order('name')),
    q(sb.from('stores').select('*').order('code')),
    q(sb.from('categories').select('*').order('sort').order('name')),
    q(sb.from('items').select('*').order('sort').order('name')),
    q(sb.from('item_admin').select('*')),
    fetchAll(() => sb.from('submissions').select('*').eq('period', A.period).order('submitted_at', {ascending: false})),
    fetchAll(() => sb.from('shipments').select('*').order('sent_at', {ascending: false})),
  ]);
  const subItems = {}, subQty = {};
  for (const ids of chunk(subs.map(s => s.id), 150)) {
    const rows = await fetchAll(() => sb.from('submission_items').select('*').in('submission_id', ids));
    rows.forEach(r => { (subItems[r.submission_id] ||= {})[r.item_id] = r.status;
      if (r.qty != null) (subQty[r.submission_id] ||= {})[r.item_id] = {qty: r.qty}; });
  }
  const latest = {};
  subs.forEach(s => { if (!latest[s.store_id]) latest[s.store_id] = s; });   // vienen ordenados desc
  // Último control de cada tienda en cualquier mes (para saber si ya respondió después de un envío)
  const lastAny = {};
  (await fetchAll(() => sb.from('submissions').select('store_id,submitted_at').order('submitted_at', {ascending: false})))
    .forEach(r => { if (!lastAny[r.store_id]) lastAny[r.store_id] = r.submitted_at; });
  const after = (sh, at) => !at || new Date(sh.sent_at) >= new Date(at);   // mismo instante = importado junto con el control
  const openShip = {}, recentShip = {};
  ships.filter(s => s.status === 'en_camino' && after(s, latest[s.store_id]?.submitted_at)).forEach(s => {
    const k = s.store_id + ':' + s.item_id; openShip[k] = (openShip[k] || 0) + s.qty;
  });
  ships.filter(s => s.status !== 'anulado' && Date.now() - new Date(s.sent_at) < 30 * 864e5).forEach(s => {
    const k = s.store_id + ':' + s.item_id; if (!recentShip[k] || s.sent_at > recentShip[k].sent_at) recentShip[k] = s;
  });
  // Saldos pendientes: se envió menos de lo pedido y la tienda aún no hizo un nuevo control
  const balances = ships.filter(s => s.requested > s.qty && s.status !== 'anulado' && after(s, lastAny[s.store_id]));
  Object.assign(A, {
    cities, stores, cats, items, subs, ships, subItems, subQty, latest, openShip, recentShip, balances, lastAny,
    iadm: Object.fromEntries(iadm.map(r => [r.item_id, r])),
    cityById: Object.fromEntries(cities.map(c => [c.id, c])),
    catById: Object.fromEntries(cats.map(c => [c.id, c])),
    storeById: Object.fromEntries(stores.map(s => [s.id, s])),
    itemById: Object.fromEntries(items.map(i => [i.id, i])),
  });
}

/* Estado de un artículo en una tienda para el mes elegido */
function cellState(storeId, itemId) {
  const sub = A.latest[storeId];
  const st = sub ? A.subItems[sub.id]?.[itemId] : null;
  if (st === 'tiene') return 'tiene';
  if (A.openShip[storeId + ':' + itemId]) return 'en_camino';
  return st || 'sin_dato';
}
const needs = s => s === 'no_tiene' || s === 'deteriorado';
const qtyPer = itemId => A.iadm[itemId]?.qty_per_store || 1;
/* Cantidad que pidió la tienda (materiales con pedido por cantidad) */
function cellQty(storeId, itemId) { const sub = A.latest[storeId]; return sub ? A.subQty[sub.id]?.[itemId] || null : null; }
/* Unidades a enviar: lo que pidió la tienda, o la cantidad por tienda del catálogo */
function needQty(storeId, itemId, state = cellState(storeId, itemId)) {
  if (!needs(state)) return 0;
  return cellQty(storeId, itemId)?.qty || qtyPer(itemId);
}
/* Texto de celda en la matriz: ✕3 = falta, pide 3 */
function cellText(storeId, itemId, state) {
  const n = needs(state) && (A.itemById[itemId]?.max_qty || 1) > 1 ? cellQty(storeId, itemId)?.qty : null;
  return STATUS[state].icon + (n ? n : '');
}

function reportItems() {
  const f = A.filters;
  return A.items.filter(i => i.active && A.catById[i.category_id]?.active)
    .filter(i => !f.cat || (f.cat.startsWith('G:') ? A.catById[i.category_id].grupo === f.cat.slice(2) : i.category_id == f.cat))
    .sort((a, b) => (A.catById[a.category_id].sort - A.catById[b.category_id].sort) || (a.sort - b.sort));
}
function reportStores() {
  return A.stores.filter(s => s.active && (!A.filters.city || s.city_id == A.filters.city))
    .sort((a, b) => (A.cityById[a.city_id].sort - A.cityById[b.city_id].sort) || a.code.localeCompare(b.code));
}
function itemTotals(items = reportItems(), stores = reportStores()) {
  return items.map(it => {
    const t = {item: it, cat: A.catById[it.category_id], adm: A.iadm[it.id] || {}, no_tiene: 0, deteriorado: 0, en_camino: 0, tiene: 0, sin_dato: 0};
    t.reponer = 0;
    stores.forEach(s => { const c = cellState(s.id, it.id); t[c]++; t.reponer += needQty(s.id, it.id, c); });
    t.stock = t.adm.stock || 0;
    t.pedir = Math.max(0, t.reponer - t.stock);
    t.costo = t.adm.suggested_price != null ? t.pedir * t.adm.suggested_price : null;
    return t;
  });
}

/* ---------- Faltantes ---------- */
function vFaltantes() {
  const m = A.filters.mode;
  const items = reportItems(), stores = reportStores();
  const head = `
  <div class="toolbar"><h2>Faltantes</h2>
    <div class="seg">${[['matriz', 'Matriz'], ['tienda', 'Por tienda'], ['ciudad', 'Por ciudad'], ['total', 'Total']].map(([k, l]) => `<button data-mode="${k}" class="${m === k ? 'on' : ''}">${l}</button>`).join('')}</div>

  if (!items.length) return head + '<div class="card empty">No hay artículos para este filtro.</div>';

  if (m === 'matriz') {
    const show = s => !A.filters.onlyNeed || needs(s);
    const catsUsed = [...new Set(items.map(i => i.category_id))];
    let rowsHtml = '', lastCity = null;
    for (const s of stores) {
      if (A.filters.onlyNeed && !items.some(i => needs(cellState(s.id, i.id)))) continue;
      if (s.city_id !== lastCity) { lastCity = s.city_id; rowsHtml += `<tr class="city"><td class="st" colspan="1">${esc(A.cityById[s.city_id].name)}</td><td colspan="${items.length + 1}"></td></tr>`; }
      rowsHtml += `<tr><td class="st"><b>${esc(s.code)}</b> ${esc(s.name)}<div class="small muted">${A.latest[s.id] ? fmtDT(A.latest[s.id].submitted_at) : 'sin envío este mes'}</div></td>${items.map(i => {
        const c = cellState(s.id, i.id); return `<td class="c ${show(c) ? 'c-' + c : ''}" title="${esc(i.name)} · ${STATUS[c].short}">${show(c) ? cellText(s.id, i.id, c) : ''}</td>`; }).join('')}
        <td class="num"><b>${items.filter(i => needs(cellState(s.id, i.id))).length}</b></td></tr>`;
    }
    return head + `<div class="tbl-wrap" style="max-height:75vh"><table class="t mx"><thead>

      <tr><th class="st" style="vertical-align:bottom">Tienda</th>${items.map(i => `<th class="it-h" title="${esc(i.name)}"><img src="${esc(photoUrl(i.thumb_path))}" alt="" loading="lazy">${esc(i.name)}</th>`).join('')}<th class="it-h">Por reponer</th></tr>
      <tr><th class="st small">Stock almacén →</th>${items.map(i => `<th class="num" style="text-align:center">${A.iadm[i.id]?.stock ?? 0}</th>`).join('')}<th></th></tr>
      </thead><tbody>${rowsHtml || `<tr><td colspan="${items.length + 2}" class="empty">Nada pendiente 🎉</td></tr>`}</tbody></table></div>`;
  }

  if (m === 'tienda') {
    const blocks = stores.map(s => {
      const list = items.map(i => ({i, c: cellState(s.id, i.id)})).filter(x => A.filters.onlyNeed ? needs(x.c) : (needs(x.c) || x.c === 'en_camino'));
      if (!list.length) return '';
      return `<div class="store-block"><div class="hd"><span class="chip navy">${esc(s.code)}</span><h3>${esc(s.name)}</h3><span class="muted small">${esc(A.cityById[s.city_id].name)}</span>
        <span class="right small muted">${A.latest[s.id] ? 'Último envío: ' + fmtDT(A.latest[s.id].submitted_at) : 'Sin envío este mes'}</span></div>
        ${list.map(x => `<div class="need-row"><img class="thumb" src="${esc(photoUrl(x.i.thumb_path))}" alt=""><div class="grow">${esc(x.i.name)}<div class="small muted">${esc(A.catById[x.i.category_id].name)}</div></div><span class="chip ${STATUS[x.c].cls}">${STATUS[x.c].short}${needs(x.c) && needQty(s.id, x.i.id, x.c) > 1 ? ' · ' + needQty(s.id, x.i.id, x.c) + ' u.' : ''}</span></div>`).join('')}</div>`;
    }).join('');
    return head + (blocks || '<div class="card empty">Ninguna tienda tiene faltantes con este filtro 🎉</div>');
  }

  if (m === 'ciudad') {
    const cities = A.cities.filter(c => stores.some(s => s.city_id === c.id));
    const rows = items.map(i => {
      const per = cities.map(c => stores.filter(s => s.city_id === c.id).reduce((a, s) => a + needQty(s.id, i.id), 0));
      const ship = stores.filter(s => cellState(s.id, i.id) === 'en_camino').length;
      return {i, per, total: per.reduce((a, b) => a + b, 0), ship};

    return head + `<div class="tbl-wrap"><table class="t"><thead><tr><th>Artículo</th><th>Categoría</th>${cities.map(c => `<th class="num">${esc(c.name)}</th>`).join('')}<th class="num">Total a reponer</th><th class="num">En camino</th></tr></thead><tbody>

/* ---------- Pedido y envío ---------- */
function pendingSends() {
  const items = reportItems(), out = [];
  for (const s of reportStores()) for (const i of items) {
    const c = cellState(s.id, i.id);
    if (needs(c)) out.push({s, i, c, qty: needQty(s.id, i.id, c), have: cellQty(s.id, i.id)});
  }
  return out;
}

          <div class="small muted">Pidió <b>${x.requested}</b> · enviado <b>${x.qty}</b> el ${fmtDate(x.sent_at)} · faltan <b style="color:var(--bad)">${falta}</b> · Stock almacén: <b style="color:${stock ? 'var(--ok)' : 'var(--bad)'}">${stock}</b></div></div>

document.addEventListener('click', async e => {
  const pm = e.target.closest('[data-pmode]'); if (pm) { A.filters.pmode = pm.dataset.pmode; return renderAdmin(); }
  let rows = null;
  const qtyOf = k => Math.max(1, parseInt($(`[data-qty="${k}"]`)?.value) || 1);
  let reqOf = null;
  const toRow = k => { if (!reqOf) { reqOf = {}; pendingSends().forEach(r => reqOf[r.s.id + ':' + r.i.id] = r.qty); }
    const [store_id, item_id] = k.split(':').map(Number); return {store_id, item_id, qty: qtyOf(k), requested: reqOf[k] || null}; };
  const bs = e.target.closest('[data-bal-send]'), bd = e.target.closest('[data-bal-drop]');
  if (bs || bd) {
    const x = A.ships.find(z => z.id == (bs || bd).dataset[bs ? 'balSend' : 'balDrop']), it = A.itemById[x.item_id], st = A.storeById[x.store_id];
    if (bd) {
      if (!await confirmBox('Descartar saldo', `Dejarás de ver el recordatorio de <b>${x.requested - x.qty}</b> ${esc(it.name)} para ${esc(st.name)}. Si aún los necesita, la tienda los volverá a pedir en su próximo control.`, 'Descartar', true)) return;
      try { await q(sb.rpc('close_balance', {p_id: x.id})); toast('Saldo descartado', 'ok'); await loadAdmin(); renderAdmin(); } catch (er) { toast(errMsg(er), 'bad'); }
      return;
    }
    const falta = x.requested - x.qty, n = Math.max(1, parseInt($(`[data-balqty="${x.id}"]`)?.value) || 1);
    rows = [{store_id: x.store_id, item_id: x.item_id, qty: n, requested: falta}];
    if (!await confirmShip(rows)) return;
    try {
      await q(sb.rpc('mark_shipped', {p_rows: rows, p_note: `Saldo del envío del ${fmtDate(x.sent_at)}`}));
      await q(sb.rpc('close_balance', {p_id: x.id}));
      toast(n < falta ? `Enviado ${n}; quedan ${falta - n} pendientes` : 'Saldo enviado', 'ok'); await loadAdmin(); renderAdmin();
    } catch (er) { toast(errMsg(er), 'bad'); }
    return;
  }
  if (e.target.closest('[data-ship-one]')) rows = [toRow(e.target.closest('[data-ship-one]').dataset.shipOne)];
  else if (e.target.closest('[data-ship-store]')) { const sid = e.target.closest('[data-ship-store]').dataset.shipStore; rows = $$(`[data-sel^="${sid}:"]`).map(c => toRow(c.dataset.sel)); }
  else if (e.target.closest('[data-ship-selected]')) { rows = $$('[data-sel]:checked').map(c => toRow(c.dataset.sel)); if (!rows.length) return toast('Selecciona al menos un artículo'); }
  else if (e.target.closest('[data-cancel-ship]')) {
    if (!await confirmBox('Anular envío', 'El artículo volverá a figurar como faltante y se devolverá la cantidad al stock de almacén.', 'Anular', true)) return;
    try { await q(sb.rpc('cancel_shipment', {p_id: +e.target.closest('[data-cancel-ship]').dataset.cancelShip})); toast('Envío anulado', 'ok'); await loadAdmin(); renderAdmin(); } catch (er) { toast(errMsg(er), 'bad'); }
    return;
  }
  if (!rows) return;
  if (!await confirmShip(rows)) return;
  try {
    await q(sb.rpc('mark_shipped', {p_rows: rows, p_note: $('#shipNote')?.value || null}));
    toast(`${rows.length} envío(s) registrados`, 'ok'); await loadAdmin(); renderAdmin();
  } catch (er) { toast(errMsg(er), 'bad'); }
});
document.addEventListener('change', e => {
  const c = e.target.closest('[data-selstore]'); if (!c) return;
  $$(`[data-sel^="${c.dataset.selstore}:"]`).forEach(x => x.checked = c.checked);
});

/* Confirmación de envío con avisos de stock y de envío parcial */
function confirmShip(rows) {
  const units = rows.reduce((a, r) => a + r.qty, 0), name = r => `${esc(A.itemById[r.item_id]?.name)} → ${esc(A.storeById[r.store_id]?.code)}`;
  const need = {}; rows.forEach(r => need[r.item_id] = (need[r.item_id] || 0) + r.qty);
  const over = Object.entries(need).filter(([id, n]) => n > (A.iadm[id]?.stock ?? 0));
  const partial = rows.filter(r => r.requested && r.qty < r.requested);
  return confirmBox('Marcar como enviado', `<p>Se marcarán <b>${rows.length}</b> artículo(s) (${units} unidades) como <b>En camino</b> y se descontarán del stock de almacén.</p>
    ${over.length ? `<div class="status-banner" style="background:var(--bad-soft);color:var(--bad)"><b>!</b><div><b>Envías más de lo que hay en stock:</b><br>${over.map(([id, n]) => `${esc(A.itemById[id]?.name)}: envías ${n}, stock ${A.iadm[id]?.stock ?? 0}`).join('<br>')}<br><span class="small">Si el stock real es distinto, actualízalo en Catálogo.</span></div></div>` : ''}
    ${partial.length ? `<div class="status-banner pending"><b>⏳</b><div><b>Envío incompleto, quedará saldo pendiente:</b><br>${partial.map(r => `${name(r)}: pidió ${r.requested}, envías ${r.qty}, faltan ${r.requested - r.qty}`).join('<br>')}</div></div>` : ''}`, 'Marcar enviado');
}

/* ---------- Orden con flechas ---------- */
function siblingsOf(kind, x) {
  const list = kind === 'item' ? A.items.filter(i => i.category_id === x.category_id) : A.cats.filter(c => c.grupo === x.grupo);
  return list.sort((a, b) => (a.sort || 0) - (b.sort || 0) || a.name.localeCompare(b.name));
}
async function moveOrder(kind, id, dir) {
  const x = (kind === 'item' ? A.itemById : A.catById)[id], sib = siblingsOf(kind, x), k = sib.indexOf(x), j = k + dir;
  if (j < 0 || j >= sib.length) return;
  [sib[k], sib[j]] = [sib[j], sib[k]];
  const base = Math.min(...sib.map(s => s.sort || 0)) || 1;   // renumera sin salirse de su rango (artes 1…, materiales 101…)
  const changes = sib.map((s, n) => ({s, sort: base + n})).filter(c => c.s.sort !== c.sort);
  changes.forEach(c => c.s.sort = c.sort); renderAdmin();       // se ve al instante
  try { await Promise.all(changes.map(c => q(sb.from(kind === 'item' ? 'items' : 'categories').update({sort: c.sort}).eq('id', c.s.id)))); }
  catch (e) { toast('No se pudo guardar el orden: ' + errMsg(e), 'bad'); await loadAdmin(); renderAdmin(); }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-mv]'); if (!b || b.disabled) return;
  const [kind, id, dir] = b.dataset.mv.split(':'); moveOrder(kind, +id, +dir);
});

    <td class="num small">${money(a.suggested_price)}</td><td class="num">${a.stock ?? 0}</td><td class="small">${(i.max_qty || 1) > 1 ? `1 a ${i.max_qty}` : 'Por unidad'}</td>
    <td style="white-space:nowrap">${(() => { const sib = siblingsOf('item', i), k = sib.indexOf(i);

    <div class="field"><label class="f">Nombre <span class="req">*</span></label><input class="inp" id="cfName" value="${esc(c.name || '')}" placeholder="Ej. Preciadores"></div>

      <div class="hint">${c.id ? 'Para cambiar su posición usa las flechas ↑ ↓ en Catálogo.' : 'Se agrega al final del grupo; luego puedes moverla con las flechas ↑ ↓.'}</div></div>`,
    {footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn" id="cfSave">Guardar</button>`});
  $('#cfSave', m.el).onclick = async () => {
    const row = {name: $('#cfName', m.el).value.trim(), grupo: $('#cfGrupo', m.el).value};
    if (!c.id || c.grupo !== row.grupo) row.sort = Math.max(0, ...A.cats.map(x => x.sort || 0)) + 1;   // al final

      m.close(); toast('Categoría guardada', 'ok'); await loadAdmin(); renderAdmin();
    } catch (e) { toast(/duplicate/.test(e.message) ? 'Ya existe esa categoría en ese grupo' : errMsg(e), 'bad'); }
  };
}

function itemForm(it = {}) {
  const a = A.iadm[it.id] || {};
  const activeCats = A.cats.filter(c => c.active || c.id === it.category_id);
  const m = modal(it.id ? 'Editar artículo' : 'Nuevo artículo', `
    <div class="field"><label class="f">Foto del arte o material</label>
      <label class="photo-drop"><img id="ifPrev" src="${esc(photoUrl(it.thumb_path))}" alt="" style="${it.thumb_path ? '' : 'visibility:hidden'}">
      <div><b>Elegir imagen</b><div class="hint">JPG, PNG o WebP. Se optimiza sola a WebP: versión grande para PC y miniatura liviana para celular, respetando su formato (A4, 50×70, horizontal…).</div></div>
      <input type="file" id="ifFile" accept="image/*" hidden></label></div>
    <div class="grid2">
      <div class="field"><label class="f">Nombre <span class="req">*</span></label><input class="inp" id="ifName" value="${esc(it.name || '')}"></div>
      <div class="field"><label class="f">Categoría <span class="req">*</span></label><select class="inp" id="ifCat">${GRUPOS.map(g => `<optgroup label="${g}">${activeCats.filter(c => c.grupo === g).map(c => `<option value="${c.id}" ${it.category_id === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('')}</select></div>
    </div>
    <div class="card" style="background:var(--navy-soft);box-shadow:none;padding:14px;margin-bottom:14px">
      <div class="small" style="font-weight:700;color:var(--navy);margin-bottom:10px">🔒 SOLO ADMIN — no lo ven las tiendas</div>
      <div class="grid2">
        <div class="field"><label class="f">Proveedor <span class="req">*</span></label><input class="inp" id="ifSup" value="${esc(a.supplier === 'POR DEFINIR' ? '' : a.supplier || '')}" placeholder="Ej. Imprenta Gráfica Norte"></div>
        <div class="field"><label class="f">Material <span class="req">*</span></label><input class="inp" id="ifMat" value="${esc(a.material === 'POR DEFINIR' ? '' : a.material || '')}" placeholder="Ej. Couché 150 g / Acrílico 3 mm"></div>
        <div class="field"><label class="f">Medida <span class="req">*</span></label><input class="inp" id="ifSize" value="${esc(a.size || '')}" placeholder="Ej. A4 (21 x 29.7 cm)"></div>
        <div class="field"><label class="f">Precio sugerido (S/)</label><input class="inp" id="ifPrice" type="number" step="0.01" min="0" value="${a.suggested_price ?? ''}" placeholder="Opcional"></div>
        <div class="field"><label class="f">Stock en almacén</label><input class="inp" id="ifStock" type="number" min="0" value="${a.stock ?? 0}"></div>
        <div class="field"><label class="f">Cantidad a enviar por defecto</label><input class="inp" id="ifQty" type="number" min="1" value="${a.qty_per_store ?? 1}"><div class="hint">Se usa cuando la tienda no indicó cuántos pide.</div></div>
      </div></div>
    <div class="grid2" style="grid-template-columns:1fr">
      <div class="field"><label class="f">Pedido máximo de la tienda</label><input class="inp" id="ifMax" type="number" min="1" max="50" value="${it.max_qty ?? 1}">
        <div class="hint">1 = por unidad. Si es mayor, cuando la tienda marque "No lo tenemos" o "Deteriorado" elegirá cuántos necesita (de 1 hasta este número).</div></div>
    </div>
    <p class="hint">${it.id ? 'Para cambiar su posición usa las flechas ↑ ↓ en la lista de Catálogo.' : 'Se agrega al final de su categoría; luego puedes moverlo con las flechas ↑ ↓.'}</p>`,
    {wide: true, footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn amber" id="ifSave">Guardar artículo</button>`});
  let photo = null;
  $('#ifFile', m.el).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { photo = await optimizeImage(f); const p = $('#ifPrev', m.el); p.src = URL.createObjectURL(photo.thumb); p.style.visibility = 'visible';
      toast(`Optimizada: ${(f.size / 1024).toFixed(0)} KB → ${(photo.full.size / 1024).toFixed(0)} KB`); }
    catch { toast('No se pudo leer la imagen', 'bad'); }
  };
  $('#ifSave', m.el).onclick = async () => {
    const v = id => $(id, m.el).value.trim();
    const base = {name: v('#ifName'), category_id: +v('#ifCat'), max_qty: Math.min(50, Math.max(1, +v('#ifMax') || 1))};
    if (!it.id || it.category_id !== base.category_id)   // nuevo o cambiado de categoría → al final
      base.sort = Math.max(0, ...A.items.filter(x => x.category_id === base.category_id).map(x => x.sort || 0)) + 1;
    const adm = {supplier: v('#ifSup'), material: v('#ifMat'), size: v('#ifSize'),
      suggested_price: v('#ifPrice') === '' ? null : +v('#ifPrice'), stock: Math.max(0, +v('#ifStock') || 0), qty_per_store: Math.max(1, +v('#ifQty') || 1)};
    if (!base.name || !base.category_id) return toast('Nombre y categoría son obligatorios', 'bad');
    if (!adm.supplier || !adm.material || !adm.size) return toast('Proveedor, material y medida son obligatorios', 'bad');
    if (!it.id && !photo) return toast('Agrega la foto del artículo', 'bad');
    const btn = $('#ifSave', m.el); btn.disabled = true; btn.textContent = 'Guardando…';
    try {
      if (photo) {
        const key = `items/${crypto.randomUUID()}`, ext = photo.full.type === 'image/webp' ? 'webp' : 'jpg';
        const up = (p, b) => q(sb.storage.from(CONFIG.BUCKET).upload(p, b, {contentType: b.type, cacheControl: '31536000', upsert: false}));
        await up(`${key}.${ext}`, photo.full); await up(`${key}_t.${ext}`, photo.thumb);
        const old = [it.photo_path, it.thumb_path].filter(p => p && !p.startsWith('seed/'));
        Object.assign(base, {photo_path: `${key}.${ext}`, thumb_path: `${key}_t.${ext}`, photo_w: photo.w, photo_h: photo.h});
        if (old.length) sb.storage.from(CONFIG.BUCKET).remove(old);
      }
      let id = it.id;
      if (id) await q(sb.from('items').update(base).eq('id', id));
      else id = (await q(sb.from('items').insert(base).select('id').single())).id;
      await q(sb.from('item_admin').upsert({item_id: id, ...adm}));
      m.close(); toast('Artículo guardado', 'ok'); await loadAdmin(); renderAdmin();
    } catch (e) { toast(errMsg(e), 'bad'); btn.disabled = false; btn.textContent = 'Guardar artículo'; }
  };
}

document.addEventListener('click', async e => {
  if ($('#adminView').classList.contains('hidden')) return;
  const t = e.target, d = s => t.closest(s);
  if (d('[data-cat-new]')) return catForm();
  if (d('[data-cat-edit]')) return catForm(A.catById[d('[data-cat-edit]').dataset.catEdit]);
  if (d('[data-item-new]')) { if (!A.cats.some(c => c.active)) return toast('Primero crea una categoría', 'bad'); return itemForm(); }
  if (d('[data-item-edit]')) return itemForm(A.itemById[d('[data-item-edit]').dataset.itemEdit]);
  if (d('[data-lb]')) { const i = A.itemById[d('[data-lb]').dataset.lb]; return lightbox(photoUrl(i.photo_path), i.name); }
  const toggle = async (table, id, active, what) => {
    if (!active && !await confirmBox(`Quitar ${what}`, `Dejará de aparecer para las tiendas y en los informes. El historial se conserva y puedes restaurarlo.`, 'Quitar', true)) return;
    try { await q(sb.from(table).update({active}).eq('id', id)); toast(active ? 'Restaurado' : 'Quitado', 'ok'); await loadAdmin(); renderAdmin(); } catch (er) { toast(errMsg(er), 'bad'); }
  };
  if (d('[data-cat-off]')) return toggle('categories', d('[data-cat-off]').dataset.catOff, false, 'categoría');

});

/* ---------- Campañas (admin) ---------- */
const CSTATUS_X = {llego: '✔', no_llego: '✘', llego_danado: '⚠'};
async function loadCampaignsAdmin() {
  const [camps, ci, cs, subs] = await Promise.all([
    q(sb.from('campaigns').select('*').order('start_date', {ascending: false})),
    fetchAll(() => sb.from('campaign_items').select('*')),
    fetchAll(() => sb.from('campaign_stores').select('*')),
    fetchAll(() => sb.from('campaign_submissions').select('*').order('submitted_at', {ascending: false})),
  ]);
  const cItems = {};
  for (const ids of chunk(subs.map(s => s.id), 150)) {
    const rows = await fetchAll(() => sb.from('campaign_submission_items').select('*').in('submission_id', ids));
    rows.forEach(r => (cItems[r.submission_id] ||= {})[r.item_id] = r);
  }
  camps.forEach(c => {
    c.itemIds = ci.filter(r => r.campaign_id === c.id).map(r => r.item_id);
    c.storeIds = cs.filter(r => r.campaign_id === c.id).map(r => r.store_id);
    c.subs = subs.filter(s => s.campaign_id === c.id);
    c.latest = {}; c.subs.forEach(s => { if (!c.latest[s.store_id]) c.latest[s.store_id] = s; });
  });
  Object.assign(A, {camps, cItems});
}
function campState(c) {
  const t = today();
  if (!c.active || c.end_date < t) return {label: 'Finalizada', cls: ''};
  if (c.start_date > t) return {label: 'Programada', cls: 'navy'};
  return {label: 'Activa', cls: 'ok'};
}
function campCell(c, storeId, itemId) { const s = c.latest[storeId]; return s ? A.cItems[s.id]?.[itemId] || null : null; }

function vCampanas() {
  if (A.campSel) { const c = A.camps.find(x => x.id === A.campSel); if (c) return vCampanaDetalle(c); A.campSel = null; }
  return `
  <div class="toolbar"><h2>Campañas</h2><span class="muted small">Validación de los artes enviados para una campaña específica.</span><button class="btn amber sm right" data-camp-new>+ Nueva campaña</button></div>
  ${A.camps.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Campaña</th><th>Vigencia</th><th>Estado</th><th class="num">Piezas</th><th>Validaron</th><th class="num">Problemas</th><th></th></tr></thead><tbody>
  ${A.camps.map(c => { const st = campState(c), n = c.storeIds.filter(s => c.latest[s]).length;
    let prob = 0; c.storeIds.forEach(s => c.itemIds.forEach(i => { const x = campCell(c, s, i); if (x && x.status !== 'llego') prob++; }));
    return `<tr><td><b>${esc(c.name)}</b>${c.description ? `<div class="small muted">${esc(c.description)}</div>` : ''}</td><td class="small">${fmtD(c.start_date)} → ${fmtD(c.end_date)}</td>
      <td><span class="chip ${st.cls}">${st.label}</span></td><td class="num">${c.itemIds.length}</td>
      <td style="min-width:150px"><div class="small"><b>${n}</b>/${c.storeIds.length} tiendas</div><div class="pbar" style="height:6px"><i style="width:${c.storeIds.length ? n / c.storeIds.length * 100 : 0}%"></i></div></td>
      <td class="num" style="color:${prob ? 'var(--bad)' : 'var(--muted)'}"><b>${prob}</b></td>
      <td style="white-space:nowrap"><button class="btn xs" data-camp-open="${c.id}">Ver informe</button> <button class="btn ghost xs" data-camp-edit="${c.id}">Editar</button></td></tr>`; }).join('')}
  </tbody></table></div>` : `<div class="card empty">Aún no hay campañas.<br><br><button class="btn amber" data-camp-new>+ Crear la primera campaña</button></div>`}
  <p class="hint">Las piezas de campaña se eligen del Catálogo (primero súbelas ahí). Siguen apareciendo en el control mensual; además, mientras la campaña está activa, las tiendas participantes ven una tarjeta para validarla.</p>`;
}

function vCampanaDetalle(c) {
  const st = campState(c);
  const stores = c.storeIds.map(id => A.storeById[id]).filter(Boolean).filter(s => !A.filters.city || s.city_id == A.filters.city)
    .sort((a, b) => (A.cityById[a.city_id].sort - A.cityById[b.city_id].sort) || a.code.localeCompare(b.code));
  const items = c.itemIds.map(id => A.itemById[id]).filter(Boolean).sort((a, b) => a.sort - b.sort);
  const cnt = {llego: 0, no_llego: 0, llego_danado: 0};
  stores.forEach(s => items.forEach(i => { const x = campCell(c, s.id, i.id); if (x) cnt[x.status]++; }));
  const done = stores.filter(s => c.latest[s.id]), pend = stores.filter(s => !c.latest[s.id]);
  const probs = [];
  stores.forEach(s => items.forEach(i => { const x = campCell(c, s.id, i.id); if (x && x.status !== 'llego') probs.push({s, i, x}); }));
  let lastCity = null;
  return `
  <div class="toolbar"><button class="btn ghost sm" data-camp-back>← Campañas</button><h2>${esc(c.name)}</h2><span class="chip ${st.cls}">${st.label}</span><span class="small muted">${fmtD(c.start_date)} → ${fmtD(c.end_date)}</span>
    ${filtersBar({cat: false})}<button class="btn ghost sm right" data-camp-edit="${c.id}">Editar</button><button class="btn sm" data-camp-x="${c.id}">⬇ Excel</button></div>
  <div class="kpis">
    <div class="kpi"><div class="v">${done.length}<span class="muted" style="font-size:16px">/${stores.length}</span></div><div class="l">Tiendas que validaron</div></div>
    <div class="kpi ok"><div class="v">${cnt.llego}</div><div class="l">Piezas que llegaron</div></div>
    <div class="kpi bad"><div class="v">${cnt.no_llego}</div><div class="l">Aún no llegan</div></div>
    <div class="kpi warn"><div class="v">${cnt.llego_danado}</div><div class="l">Llegaron dañadas</div></div>
  </div>
  <div class="legend" style="margin-bottom:10px">${Object.entries(CSTATUS).map(([k, s]) => `<span class="chip ${s.cls}">${s.icon} ${s.short}</span>`).join('')}<span class="chip">📷 tiene foto (clic para ver)</span></div>
  <div class="tbl-wrap"><table class="t"><thead><tr><th>Tienda</th><th>Validó</th>${items.map(i => `<th style="text-align:center;min-width:90px"><img class="thumb" src="${esc(photoUrl(i.thumb_path))}" alt=""><div style="text-transform:none;letter-spacing:0;font-size:11px;white-space:normal;color:var(--ink)">${esc(i.name)}<div class="muted" style="font-weight:500">${esc(A.catById[i.category_id]?.name || '')}</div></div></th>`).join('')}<th>Obs.</th></tr></thead><tbody>
  ${stores.map(s => { const sub = c.latest[s.id]; let row = '';
    if (s.city_id !== lastCity) { lastCity = s.city_id; row += `<tr class="city"><td colspan="${items.length + 3}">${esc(A.cityById[s.city_id].name)}</td></tr>`; }
    return row + `<tr><td><span class="chip navy">${esc(s.code)}</span> ${esc(s.name)}</td><td class="small">${sub ? fmtDT(sub.submitted_at) : '<span class="chip amber">Pendiente</span>'}</td>
      ${items.map(i => { const x = campCell(c, s.id, i.id); if (!x) return '<td class="c c-sin_dato" style="text-align:center">·</td>';
        const m = CSTATUS[x.status], ship = A.openShip[s.id + ':' + i.id];
        return `<td style="text-align:center"><span class="chip ${m.cls}">${m.icon} ${m.short}</span>${x.photo_path ? ` <button class="btn ghost xs" data-ev="${esc(x.photo_path)}" data-evcap="${esc(s.name + ' · ' + i.name)}">📷</button>` : ''}${ship && x.status !== 'llego' ? '<div class="small" style="color:var(--ship)">➜ reenviado</div>' : ''}</td>`; }).join('')}
      <td class="small">${esc(sub?.notes || '')}</td></tr>`; }).join('')}
  </tbody></table></div>
  ${pend.length ? `<div class="card" style="margin-top:14px"><b>Falta validar (${pend.length}):</b> <span class="small">${pend.map(s => `${esc(s.code)} ${esc(s.name)}`).join(' · ')}</span></div>` : ''}
  ${probs.length ? `<div class="store-block" style="margin-top:14px"><div class="hd"><h3>Por resolver</h3><span class="small muted">Piezas que no llegaron o llegaron dañadas</span>
      <button class="btn ok sm right" data-camp-reship="all">✓ Marcar todo como reenviado</button></div>
    ${probs.map(p => { const ship = A.openShip[p.s.id + ':' + p.i.id]; return `<div class="need-row"><img class="thumb" src="${esc(photoUrl(p.i.thumb_path))}" alt="">
      <div class="grow">${esc(p.i.name)}<div class="small muted">${esc(p.s.code)} · ${esc(p.s.name)} · Stock almacén: ${A.iadm[p.i.id]?.stock ?? 0}</div></div>
      <span class="chip ${CSTATUS[p.x.status].cls}">${CSTATUS[p.x.status].short}</span>
      ${ship ? '<span class="chip ship">➜ En camino</span>' : `<button class="btn ghost sm" data-camp-reship="${p.s.id}:${p.i.id}">Reenviado</button>`}</div>`; }).join('')}</div>` : ''}`;
}

function campForm(c = null) {
  const sel = new Set(c?.itemIds || []), selS = new Set(c ? c.storeIds : A.stores.filter(s => s.active).map(s => s.id));
  const items = A.items.filter(i => i.active && A.catById[i.category_id]?.active)
    .sort((a, b) => (A.catById[a.category_id].sort - A.catById[b.category_id].sort) || a.sort - b.sort);
  const t = today();
  const m = modal(c ? 'Editar campaña' : 'Nueva campaña', `
    <div class="field"><label class="f">Nombre <span class="req">*</span></label><input class="inp" id="cmName" value="${esc(c?.name || '')}" placeholder="Ej. Navidad 2026"></div>

    <div class="field"><div class="row" style="margin-bottom:6px;gap:8px"><label class="f" style="margin:0">Tiendas participantes <span class="req">*</span> <span class="muted" id="cmStoresN"></span></label>
      <span class="right row" style="gap:6px"><button type="button" class="btn ghost xs" data-cm-all="1">Todas</button><button type="button" class="btn ghost xs" data-cm-all="0">Ninguna</button></span></div>
      ${A.cities.map(ci => { const ss = A.stores.filter(s => s.city_id === ci.id && s.active); if (!ss.length) return '';
        return `<div class="store-pick"><label class="sp-city"><input type="checkbox" data-cm-city="${ci.id}"> ${esc(ci.name)}</label>
        <div class="sp-grid">${ss.map(s => `<label class="sp-item"><input type="checkbox" data-cm-store="${s.id}" data-city="${ci.id}" ${selS.has(s.id) ? 'checked' : ''}><b>${esc(s.code)}</b><span>${esc(s.name.replace(/^Tienda /, ''))}</span></label>`).join('')}</div></div>`; }).join('')}
    </div>`,
    {wide: true, footer: `${c ? `<button class="btn ghost danger-t" id="cmDel" style="margin-right:auto;color:var(--bad)">Eliminar</button>${c.active ? '<button class="btn ghost" id="cmEndNow">Finalizar ya</button>' : '<button class="btn ghost" id="cmReopen">Reactivar</button>'}` : ''}<button class="btn ghost" data-close>Cancelar</button><button class="btn amber" id="cmSave">Guardar campaña</button>`});
  const count = () => { $('#cmItemsN', m.el).textContent = `(${$$('[data-cm-item]:checked', m.el).length} elegidas)`; $('#cmStoresN', m.el).textContent = `(${$$('[data-cm-store]:checked', m.el).length} elegidas)`;
    $$('[data-cm-city]', m.el).forEach(cb => { const all = $$(`[data-cm-store][data-city="${cb.dataset.cmCity}"]`, m.el); cb.checked = all.every(x => x.checked); }); };
  count();
  m.el.addEventListener('change', e => {
    if (e.target.dataset.cmCity) $$(`[data-cm-store][data-city="${e.target.dataset.cmCity}"]`, m.el).forEach(x => x.checked = e.target.checked);
    count();
  });
  m.el.addEventListener('click', async e => {
    const all = e.target.closest('[data-cm-all]'); if (all) { $$('[data-cm-store]', m.el).forEach(x => x.checked = all.dataset.cmAll === '1'); count(); }
    if (e.target.closest('#cmEndNow') || e.target.closest('#cmReopen')) {
      try { await q(sb.from('campaigns').update({active: !!e.target.closest('#cmReopen')}).eq('id', c.id)); m.close(); toast('Listo', 'ok'); await loadCampaignsAdmin(); renderAdmin(); } catch (er) { toast(errMsg(er), 'bad'); }
    }
    if (e.target.closest('#cmDel')) {

/* =====================================================================
   EXPORTAR A EXCEL (ExcelJS, carga bajo demanda)
