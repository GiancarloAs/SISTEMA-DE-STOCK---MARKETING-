async function XL() {
  if (window.ExcelJS) return window.ExcelJS;
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = CONFIG.EXCELJS; s.onload = res; s.onerror = rej; document.head.append(s); });
  return window.ExcelJS;
}
const XFILL = {tiene: 'FFE3F6EC', no_tiene: 'FFFDEAEA', deteriorado: 'FFFFF1D9', en_camino: 'FFE6EEFD', sin_dato: 'FFF3F4F9'};
const XFONT = {tiene: 'FF17914F', no_tiene: 'FFD63B3B', deteriorado: 'FFD98200', en_camino: 'FF2F68D8', sin_dato: 'FF9AA0B8'};
const XSYM = {tiene: '✔', no_tiene: '✘', deteriorado: '⚠', en_camino: '➜', sin_dato: '—'};
function xlSheet(wb, name, title, headers, rows, widths = []) {
  const ws = wb.addWorksheet(name.replace(/[\\/?*[\]:]/g, ' ').slice(0, 31), {views: [{state: 'frozen', ySplit: 4}]});
  ws.mergeCells(1, 1, 1, Math.max(headers.length, 4));
  ws.getCell(1, 1).value = `NORAVES · ${title}`;
  ws.getCell(1, 1).font = {bold: true, size: 14, color: {argb: 'FF0D11B5'}};
  ws.getCell(2, 1).value = `Mes: ${periodLabel(A.period)} · Generado: ${fmtDT(new Date())}${A.filters.city ? ' · Ciudad: ' + A.cityById[A.filters.city]?.name : ''}`;
  ws.getCell(2, 1).font = {size: 10, color: {argb: 'FF6B7090'}};
  const hr = ws.getRow(4); hr.values = headers; hr.height = 22;
  hr.eachCell(c => { c.font = {bold: true, color: {argb: 'FFFFFFFF'}}; c.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF0D11B5'}}; c.alignment = {vertical: 'middle', wrapText: true}; });
  rows.forEach(r => ws.addRow(r));
  headers.forEach((h, k) => ws.getColumn(k + 1).width = widths[k] || Math.max(10, String(h).length + 2));
  ws.autoFilter = {from: {row: 4, column: 1}, to: {row: 4, column: headers.length}};
  return ws;
}
function paintStatus(ws, firstRow, colFrom, colTo) {
  for (let r = firstRow; r <= ws.rowCount; r++) for (let c = colFrom; c <= colTo; c++) {
    const cell = ws.getCell(r, c), v = String(cell.value ?? ''), k = Object.keys(XSYM).find(k => (v && v.startsWith(XSYM[k])) || STATUS[k].short === v);
    if (k) { cell.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: XFILL[k]}}; cell.font = {bold: true, color: {argb: XFONT[k]}}; cell.alignment = {horizontal: 'center'}; }
  }
}
async function imgToPng(url) {
  const img = new Image(); img.crossOrigin = 'anonymous'; img.src = url; await img.decode();
  const s = 120 / img.height, c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = 120;
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/png');
}

  if (prov.length) prov.push(['TOTAL', '', '', '', '', '', ts.reduce((a, t) => a + t.reponer, 0), '', ts.reduce((a, t) => a + t.pedir, 0), '', ts.reduce((a, t) => a + (t.costo || 0), 0) || '']);
  const ws = xlSheet(wb, 'Pedir al proveedor', 'Pedido a proveedores', ['Proveedor', 'Grupo', 'Categoría', 'Artículo', 'Material', 'Medida', 'Necesitan', 'Stock almacén', 'A pedir', 'Precio sug.', 'Subtotal'], prov, [26, 12, 20, 32, 20, 18, 11, 13, 10, 12, 12]);
  [10, 11].forEach(c => ws.getColumn(c).numFmt = '"S/ "#,##0.00');
  if (prov.length) ws.getRow(ws.rowCount).font = {bold: true};
  ws.getColumn(9).font = {bold: true};
  return ws;
}
function addPedido(wb) {
  const env = pendingSends().map(r => [A.cityById[r.s.city_id].name, r.s.code, r.s.name, A.catById[r.i.category_id].name, r.i.name, STATUS[r.c].short, r.qty, A.iadm[r.i.id]?.supplier || '', '']);
  paintStatus(xlSheet(wb, 'Enviar a tiendas', 'Lo que hay que enviar y a qué tienda', ['Ciudad', 'Código', 'Tienda', 'Categoría', 'Artículo', 'Motivo', 'Cantidad', 'Proveedor', 'Enviado (✔)'], env, [12, 9, 26, 20, 32, 13, 10, 24, 12]), 5, 6, 6);
  addProveedor(wb);
  const open = A.ships.filter(x => x.status === 'en_camino' && A.storeById[x.store_id]).map(x => { const s = A.storeById[x.store_id]; return [fmtDT(x.sent_at), A.cityById[s.city_id]?.name, s.code, s.name, A.itemById[x.item_id]?.name, x.qty, x.note || '']; });
  xlSheet(wb, 'En camino', 'Envíos en camino', ['Enviado', 'Ciudad', 'Código', 'Tienda', 'Artículo', 'Cant.', 'Nota'], open, [16, 12, 9, 26, 32, 7, 36]);
  const bal = A.balances.map(x => { const s = A.storeById[x.store_id]; return [fmtDT(x.sent_at), A.cityById[s?.city_id]?.name, s?.code, s?.name, A.itemById[x.item_id]?.name, x.requested, x.qty, x.requested - x.qty]; });
  xlSheet(wb, 'Saldos pendientes', 'Envíos incompletos con saldo pendiente', ['Enviado', 'Ciudad', 'Código', 'Tienda', 'Artículo', 'Pidió', 'Enviado', 'Falta'], bal, [16, 12, 9, 26, 32, 8, 9, 8]);
}
function addCatalogo(wb) {
  const rows = A.items.map(i => { const a = A.iadm[i.id] || {}, c = A.catById[i.category_id]; return [c?.grupo, c?.name, i.name, a.supplier, a.material, a.size, a.suggested_price ?? '', a.stock ?? 0, (i.max_qty || 1) > 1 ? `1 a ${i.max_qty}` : 'Por unidad', i.active && c?.active ? 'Activo' : 'Quitado']; });
  xlSheet(wb, 'Catálogo', 'Catálogo de artes y materiales', ['Grupo', 'Categoría', 'Artículo', 'Proveedor', 'Material', 'Medida', 'Precio sug.', 'Stock', 'Pedido', 'Estado'], rows, [12, 20, 32, 24, 20, 18, 12, 8, 11, 10]).getColumn(7).numFmt = '"S/ "#,##0.00';
}
async function download(wb, name) {
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download = `${name}_${A.period.slice(0, 7)}.xlsx`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function exportView(kind) {
  toast('Generando Excel…');
  try {
    const wb = new (await XL()).Workbook(); wb.creator = 'Noraves Marketing';
    if (kind === 'registros') { addRegistros(wb); return download(wb, 'Noraves_Registros'); }
    if (kind === 'catalogo') { addCatalogo(wb); return download(wb, 'Noraves_Catalogo'); }
    if (kind === 'pedido') { addPedido(wb); return download(wb, 'Noraves_Pedido_y_Envio'); }
    if (kind === 'proveedor') { addProveedor(wb); return download(wb, 'Noraves_Pedido_Proveedor'); }
    const m = A.filters.mode;
    if (m === 'matriz') await addMatriz(wb, reportItems()); else if (m === 'tienda') addPorTienda(wb); else if (m === 'ciudad') addPorCiudad(wb); else addTotal(wb);
    download(wb, 'Noraves_Faltantes_' + m);
  } catch (e) { toast('No se pudo generar el Excel: ' + errMsg(e), 'bad'); }
}
async function exportTodo() {
  toast('Generando Excel completo…');
  try {
    const wb = new (await XL()).Workbook(); wb.creator = 'Noraves Marketing';
    addRegistros(wb);
    await addMatriz(wb, reportItems(), 'Matriz general');
    addPorTienda(wb); addPorCiudad(wb); addTotal(wb); addPedido(wb);
    for (const c of A.cats.filter(c => c.active)) {      // una hoja por categoría
      const its = reportItems().filter(i => i.category_id === c.id);
      if (its.length) await addMatriz(wb, its, `${c.grupo === 'ARTES' ? 'A' : 'M'} · ${c.name}`, false);
    }
    addCatalogo(wb);
    await download(wb, 'Noraves_Control_Tiendas_COMPLETO');
  } catch (e) { toast('No se pudo generar el Excel: ' + errMsg(e), 'bad'); }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (b) exportView(b.dataset.x); });

/* ===================================================================== */
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { ME = null; } });
route();
</script>
